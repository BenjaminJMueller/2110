<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Ein SDI-Signal wird im 2110 IP Converter in drei Netzwerkströme aufgeteilt: Video, Audio und Daten</title>
  <style>
    .n{fill:var(--card);stroke:var(--hair);stroke-width:1}
    .t{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--fg)}
    .s{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
    .l{fill:none;stroke-linecap:round}
  </style>
  <path class="l" d="M118 180 H232" stroke="var(--muted)" stroke-width="6"/>
  <path class="l" d="M372 168 C430 168 440 70 500 70" stroke="var(--accent)" stroke-width="4"/>
  <path class="l" d="M372 180 H500" stroke="var(--muted)" stroke-width="2.5"/>
  <path class="l" d="M372 192 C430 192 440 290 500 290" stroke="var(--muted)" stroke-width="2"/>
  <g fill="var(--accent)"><circle cx="400" cy="160" r="3.5"/><circle cx="432" cy="120" r="3.5"/><circle cx="452" cy="88" r="3.5"/><circle cx="476" cy="72" r="3.5"/></g>
  <g fill="var(--muted)"><circle cx="420" cy="180" r="2.5"/><circle cx="470" cy="180" r="2.5"/><circle cx="440" cy="250" r="2"/></g>
  <rect class="n" x="12" y="150" width="106" height="60" rx="10"/><text class="t" x="28" y="176">Kamera</text><text class="s" x="28" y="195">SDI 1080p50</text>
  <rect class="n" x="232" y="140" width="140" height="80" rx="10"/><text class="t" x="248" y="172">2110 IP</text><text class="t" x="248" y="190">Converter</text><text class="s" x="248" y="208">SDI → IP</text>
  <rect class="n" x="500" y="40" width="128" height="60" rx="10"/><text class="t" x="514" y="66">Video</text><text class="s" x="514" y="85">ST 2110-20</text>
  <rect class="n" x="500" y="150" width="128" height="60" rx="10"/><text class="t" x="514" y="176">Audio</text><text class="s" x="514" y="195">ST 2110-30</text>
  <rect class="n" x="500" y="260" width="128" height="60" rx="10"/><text class="t" x="514" y="286">Daten</text><text class="s" x="514" y="305">ST 2110-40</text>
</svg>
