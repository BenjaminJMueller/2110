<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>2110 Viewer</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d32"/>
      <stop offset="1" stop-color="#18191c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <!-- drei Ströme (Video, Audio, Daten) laufen in die Wiedergabe -->
  <path d="M244 432 H352" stroke="#ececef" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M220 512 H352" stroke="#c9cad0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M268 592 H352" stroke="#8e9097" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Play-Taste -->
  <path d="M446 330 L776 512 L446 694 Z" fill="#4f87ff" stroke="#4f87ff" stroke-width="64" stroke-linejoin="round"/>
</svg>
