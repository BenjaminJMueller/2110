name: Build und Tests

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "DMG als GitHub-Release veröffentlichen (Tag v<VERSION>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-linux:
    name: Kern (Linux, synthetische Tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools tcpdump
      - name: Bauen und testen
        run: |
          make -C core
          ./core/build/test_unit core/tests/sdp
          ./core/build/st2110-probe --selftest
          sudo TEST_WIDTH=960 TEST_HEIGHT=540 ./core/tests/run_loopback_tests.sh
          if [ -x core/tests/run_sender_tests.sh ]; then sudo TEST_WIDTH=640 TEST_HEIGHT=360 ./core/tests/run_sender_tests.sh; fi
          if [ -x core/tests/run_analyzer_tests.sh ]; then ./core/tests/run_analyzer_tests.sh; fi

  app-macos:
    name: App, DMG und Lizenzprüfung (macOS, Apple Silicon)
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode wählen
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: GStreamer-Pakete (Cache)
        uses: actions/cache@v4
        with:
          path: vendor/downloads
          key: gstreamer-1.28.8
      - name: GStreamer entpacken
        run: ./scripts/fetch-gstreamer.sh
      - name: Unit-Tests
        run: GSTREAMER_PREFIX=$PWD/vendor/gstreamer swift test --filter ST2110KitTests
      - name: App bauen, signieren (ad hoc), Selbsttest, Lizenzprüfung, DMG
        run: ./scripts/build-app.sh
      - name: Bildschirmfotos für Usability-Prüfung und Webseite
        run: |
          mkdir -p dist/screenshots
          # Zeitbegrenzung 5 min (macOS hat kein „timeout“)
          perl -e 'alarm 300; exec @ARGV' "dist/2110 Viewer.app/Contents/MacOS/ST2110Viewer" --render-screenshots "$PWD/dist/screenshots" -AppleLanguages "(de)" || echo "Bildschirmfotos nicht vollständig"
          cat dist/screenshots/bericht.txt || true
          mkdir -p dist/screenshots/en
          perl -e 'alarm 300; exec @ARGV' "dist/2110 Viewer.app/Contents/MacOS/ST2110Viewer" --render-screenshots "$PWD/dist/screenshots/en" -AppleLanguages "(en)" || echo "Englische Bildschirmfotos nicht vollständig"
          ls -la dist/screenshots dist/screenshots/en || true
      - name: Quellcode der Drittanbieter-Bibliotheken (LGPL)
        run: ./scripts/fetch-third-party-sources.sh
      - name: Bundle prüfen
        run: |
          APP="dist/2110 Viewer.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -12
          du -sh "$APP" dist/*.dmg
          ! find "$APP" -type f \( -name "*.dylib" -o -perm -u+x \) -exec otool -L {} \; | grep -E "/(opt|usr/local|Library/Frameworks)/"
          spctl -a -vv "$APP" || echo "Erwartet: Gatekeeper lehnt ad-hoc-signierte Apps ab (keine Developer ID)."
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: 2110-Viewer-dmg
          path: |
            dist/*.dmg
            dist/*third-party-sources.tar.gz
            dist/license-audit-*.txt
          retention-days: 30
      - name: Bildschirmfotos hochladen
        uses: actions/upload-artifact@v4
        with:
          name: 2110-Viewer-screenshots
          path: dist/screenshots
          if-no-files-found: ignore
      - name: Release-Dateien vorbereiten
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          V=$(cat VERSION)
          mkdir -p dist/release
          cp "dist/2110-Viewer-$V.dmg" dist/release/2110-Viewer.dmg
          cp "dist/2110-Viewer-$V.dmg" dist/*third-party-sources.tar.gz dist/license-audit-*.txt dist/release/
          echo "TAG=v$V" >> "$GITHUB_ENV"
      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 2110 Viewer ${{ env.TAG }}
          make_latest: true
          body: |
            DMG öffnen, „2110 Viewer“ in „Programme“ ziehen. Die App ist ad hoc signiert, nicht notarisiert: beim ersten Start einmal Systemeinstellungen › Datenschutz & Sicherheit › „Dennoch öffnen“.

            Enthält GStreamer und weitere Bibliotheken (LGPL-2.1, BSD, MIT, zlib). Den vollständigen Quellcode dieser Bibliotheken enthält das Archiv *third-party-sources.tar.gz*, die Lizenzprüfberichte liegen bei.
          files: dist/release/*
