name: macOS-Build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  core-linux:
    name: Empfangskern (Linux, synthetische Tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools
      - name: Bauen und testen
        run: |
          make -C core
          ./core/build/test_unit core/tests/sdp
          ./core/build/st2110-probe --selftest
          sudo ./core/tests/run_loopback_tests.sh

  app-macos:
    name: App und DMG (macOS, Apple Silicon)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode wählen
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          swift --version
      - name: GStreamer-Pakete (Cache)
        uses: actions/cache@v4
        with:
          path: vendor/downloads
          key: gstreamer-1.28.8
      - name: GStreamer entpacken
        run: ./scripts/fetch-gstreamer.sh
      - name: Unit-Tests (NMOS, Adressbereiche, Diagnose)
        run: GSTREAMER_PREFIX=$PWD/vendor/gstreamer swift test --filter ST2110KitTests
      - name: App bauen, signieren (ad hoc), Selbsttest, DMG
        run: ./scripts/build-app.sh
      - name: Bundle prüfen
        run: |
          APP="dist/ST 2110 Monitor.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20
          otool -L "$APP/Contents/MacOS/ST2110Monitor" | head -20
          du -sh "$APP"
          # Prüft, dass keine Bibliothek außerhalb des Bundles (z. B. /Library/Frameworks oder Homebrew) referenziert wird
          ! find "$APP" -type f \( -name "*.dylib" -o -perm -u+x \) -exec otool -L {} \; | grep -E "/(opt|usr/local|Library/Frameworks)/"
          spctl -a -vv "$APP" || echo "Erwartet: Gatekeeper lehnt ad-hoc-signierte Apps ab (keine Developer ID)."
      - name: DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ST2110-Monitor-dmg
          path: dist/*.dmg
          retention-days: 30
